<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TextYou // Messenger</title>
  <style>
    :root { --bg:#1a1525; --win:#231d33; --border:#8e6cef; --pink:#ff6b9d; --cyan:#5ce1e6; --text:#f3effa; --muted:#a699c2; }
    * { box-sizing:border-box; margin:0; padding:0; font-family:'Courier New',monospace; }
    body { background:var(--bg); color:var(--text); height:100dvh; width:100vw; display:flex; justify-content:center; align-items:center; overflow:hidden; }
    .os-window { width:95%; max-width:900px; height:92dvh; background:var(--win); border:2px solid var(--border); border-radius:10px; display:flex; flex-direction:column; overflow:hidden; position:relative; }
    .title-bar { background:linear-gradient(90deg,#4b2c7a,#8e44ad); padding:10px 14px; display:flex; justify-content:space-between; align-items:center; border-bottom:2px solid var(--border); flex-shrink:0; gap:8px; }
    .btn-top { background:rgba(0,0,0,0.4); border:1px solid var(--cyan); color:var(--cyan); padding:5px 9px; border-radius:4px; font-size:0.75rem; cursor:pointer; white-space:nowrap; }
    .main-layout { display:flex; flex:1; overflow:hidden; }
    .sidebar { width:230px; background:#1c1729; border-right:2px solid #3c2e5c; padding:16px; display:flex; flex-direction:column; align-items:center; text-align:center; flex-shrink:0; }
    .avatar-box { width:105px; height:105px; border:2px solid var(--pink); border-radius:10px; background:#2b2140; display:flex; justify-content:center; align-items:center; font-size:3rem; margin-bottom:10px; position:relative; overflow:hidden; flex-shrink:0; }
    .avatar-box img { width:100%; height:100%; object-fit:cover; }
    .status-dot { width:11px; height:11px; background:#4ade80; border-radius:50%; position:absolute; bottom:4px; right:4px; border:2px solid #1c1729; }
    .char-name { font-weight:bold; font-size:1.05rem; color:var(--pink); }
    .char-bio { font-size:0.75rem; color:var(--muted); margin:6px 0 14px; }
    .rooms-list { width:100%; flex:1; overflow-y:auto; border-top:1px solid #3c2e5c; padding-top:10px; text-align:left; }
    .room-item { background:#261f38; border:1px solid #48386e; padding:8px; border-radius:6px; margin-bottom:6px; font-size:0.8rem; cursor:pointer; display:flex; align-items:center; gap:8px; }
    .room-item.active { border-color:var(--pink); background:#352952; }
    .mini-av { width:24px; height:24px; border-radius:50%; object-fit:cover; flex-shrink:0; }
    .chat-section { flex:1; display:flex; flex-direction:column; min-width:0; overflow:hidden; }
    .messages-area { flex:1; padding:14px; overflow-y:auto; display:flex; flex-direction:column; gap:10px; }
    .msg-row { display:flex; align-items:flex-end; gap:8px; max-width:85%; }
    .msg-row.reaper { align-self:flex-start; }
    .msg-row.mortal { align-self:flex-end; flex-direction:row-reverse; }
    .msg-av { width:32px; height:32px; border-radius:8px; object-fit:cover; border:1px solid var(--border); background:#2b2140; flex-shrink:0; display:flex; align-items:center; justify-content:center; }
    .msg { padding:9px 12px; border-radius:8px; font-size:0.9rem; line-height:1.4; word-break:break-word; }
    .msg.reaper { background:#322947; border-left:3px solid var(--pink); }
    .msg.mortal { background:#6c3ce9; border-right:3px solid var(--cyan); }
    .msg-meta { font-size:0.68rem; opacity:0.75; margin-bottom:4px; display:flex; justify-content:space-between; gap:10px; }
    .typing-bar { height:20px; padding:0 14px; font-size:0.75rem; color:var(--cyan); font-style:italic; flex-shrink:0; }
    .input-area { border-top:2px solid #3c2e5c; background:#1c1729; padding:10px; display:flex; gap:8px; flex-shrink:0; }
    .input-area input[type="text"] { flex:1; min-width:0; background:#2b2242; border:1px solid var(--border); color:var(--text); padding:10px; border-radius:6px; outline:none; font-size:16px; }
    .input-area button { background:var(--pink); color:#1a1525; border:none; padding:0 16px; border-radius:6px; font-weight:bold; cursor:pointer; flex-shrink:0; }
    .modal-overlay { position:absolute; inset:0; background:rgba(15,11,24,0.94); display:none; justify-content:center; align-items:center; z-index:20; padding:16px; }
    .modal-box { background:var(--win); border:2px solid var(--pink); border-radius:10px; padding:18px; width:100%; max-width:350px; display:flex; flex-direction:column; gap:12px; }
    .modal-box input { background:#1c1729; border:1px solid var(--border); color:var(--text); padding:10px; border-radius:6px; width:100%; font-size:16px; }
    .save-btn { background:var(--pink); color:#1a1525; border:none; padding:11px; border-radius:6px; font-weight:bold; cursor:pointer; }
    @media (max-width: 680px) {
      .os-window { width:100%; height:100dvh; border:none; border-radius:0; }
      .main-layout { flex-direction:column; }
      .sidebar { width:100%; border-right:none; border-bottom:2px solid #3c2e5c; padding:8px 12px; flex-direction:row; flex-wrap:wrap; align-items:center; text-align:left; gap:10px; }
      .avatar-box { width:44px; height:44px; font-size:1.5rem; margin-bottom:0; border-radius:8px; }
      .status-dot { width:9px; height:9px; bottom:2px; right:2px; }
      .char-name { font-size:0.95rem; }
      .char-bio { display:none; }
      .rooms-list { width:100%; flex:none; border-top:1px solid #3c2e5c; padding-top:6px; margin-top:2px; display:flex; align-items:center; gap:6px; overflow-x:auto; white-space:nowrap; }
      .room-item { margin-bottom:0; padding:5px 8px; flex-shrink:0; }
    }
  </style>
</head>
<body>
  <div class="os-window">
    <div class="modal-overlay" id="profile-modal">
      <div class="modal-box">
        <div style="display:flex;justify-content:space-between;align-items:center;">
          <h3 id="modal-title" style="color:var(--pink);font-size:1rem;">SOUL ACCESS</h3>
          <button type="button" id="close-modal-btn" onclick="closeModal()" style="background:none;border:1px solid var(--muted);color:var(--muted);padding:2px 8px;cursor:pointer;">X</button>
        </div>
        <div id="auth-tabs" style="display:flex;gap:6px;">
          <button type="button" id="tab-signup" onclick="setAuthMode('signup')" style="flex:1;padding:6px;background:var(--pink);color:#1a1525;border:none;border-radius:4px;font-weight:bold;cursor:pointer;">Sign Up</button>
          <button type="button" id="tab-signin" onclick="setAuthMode('signin')" style="flex:1;padding:6px;background:#1c1729;color:var(--text);border:1px solid var(--border);border-radius:4px;cursor:pointer;">Sign In</button>
        </div>
        <input type="text" id="name-input" maxlength="20" placeholder="Username / Nickname..." />
        <input type="password" id="pass-input" maxlength="20" placeholder="Password..." />
        <div id="avatar-picker-wrap">
          <div style="font-size:0.75rem;color:var(--cyan);margin-bottom:4px;">Profile picture (optional):</div>
          <input type="file" id="file-input" accept="image/*" />
        </div>
        <button type="button" class="save-btn" id="save-btn" onclick="handleAuthSubmit()">SIGN UP & ENTER</button>
        <button type="button" id="logout-btn" onclick="mortalLogout()" style="display:none;background:none;border:1px solid #e11d48;color:#e11d48;padding:7px;border-radius:6px;cursor:pointer;font-size:0.8rem;">Log Out</button>
      </div>
    </div>

    <div class="title-bar">
      <div style="font-weight:bold;font-size:0.95rem;">💀 TextYou</div>
      <div style="display:flex;gap:8px;">
        <button type="button" class="btn-top" onclick="openModal()">My Profile</button>
        <button type="button" class="btn-top" id="auth-btn" onclick="toggleReaper()">I'm the Reaper</button>
      </div>
    </div>

    <div class="main-layout">
      <aside class="sidebar">
        <div class="avatar-box" id="reaper-av">💀<div class="status-dot"></div></div>
        <div>
          <div class="char-name" id="reaper-name">THE REAPER</div>
          <div class="char-bio">"Online • Waiting for souls"</div>
        </div>
        <div class="rooms-list" id="rooms-panel" style="display:none;">
          <div style="font-size:0.75rem;color:var(--cyan);margin-bottom:8px;">SOULS:</div>
          <div id="rooms-container"></div>
          <button type="button" onclick="deleteCurrentRoom()" style="width:100%;margin-top:10px;background:#e11d48;color:#fff;border:none;padding:7px;border-radius:6px;font-size:0.75rem;font-weight:bold;cursor:pointer;">🗑️ Delete Chat</button>
        </div>
      </aside>
      <section class="chat-section">
        <div class="messages-area" id="messages"></div>
        <div class="typing-bar" id="typing"></div>
        <form class="input-area" onsubmit="sendMessage(event)">
          <input type="file" id="chat-img-input" accept="image/*" style="display:none;" onchange="sendChatImage(event)" />
          <button type="button" onclick="document.getElementById('chat-img-input').click()" style="background:#2b2242;color:var(--cyan);border:1px solid var(--border);padding:0 12px;">📷</button>
          <input type="text" id="msg-input" placeholder="Type a message..." autocomplete="off" oninput="notifyTyping()" required />
          <button type="submit">SEND</button>
        </form>
      </section>
    </div>
  </div>

  <script>
    const DB = "https://textyoudevereaux-default-rtdb.europe-west1.firebasedatabase.app/";
    const PASS = "Devereaux1111";

    let isReaper = localStorage.getItem("is_reaper") === "true";
    let room = localStorage.getItem("mortal_room") || "";
    let myName = localStorage.getItem(isReaper ? "r_name" : "m_name") || (isReaper ? "THE REAPER" : "");
    let myAvatar = localStorage.getItem(isReaper ? "r_av" : "m_av") || "";
    let authMode = "signup";
    let lastCount = 0;
    let roomCounts = {};
    function setAuthMode(mode) {
      authMode = mode;
      const isUp = mode === "signup";
      document.getElementById("tab-signup").style.background = isUp ? "var(--pink)" : "#1c1729";
      document.getElementById("tab-signup").style.color = isUp ? "#1a1525" : "var(--text)";
      document.getElementById("tab-signin").style.background = !isUp ? "var(--pink)" : "#1c1729";
      document.getElementById("tab-signin").style.color = !isUp ? "#1a1525" : "var(--text)";
      document.getElementById("avatar-picker-wrap").style.display = isUp ? "block" : "none";
      document.getElementById("save-btn").textContent = isUp ? "SIGN UP & ENTER" : "SIGN IN";
    }

    function openModal() {
      const loggedMortal = !isReaper && room && myName;
      document.getElementById("modal-title").textContent = isReaper ? "REAPER PROFILE" : (loggedMortal ? "EDIT PROFILE" : "SOUL ACCESS");
      document.getElementById("auth-tabs").style.display = (isReaper || loggedMortal) ? "none" : "flex";
      document.getElementById("pass-input").style.display = (isReaper || loggedMortal) ? "none" : "block";
      document.getElementById("avatar-picker-wrap").style.display = (isReaper || loggedMortal || authMode === "signup") ? "block" : "none";
      document.getElementById("save-btn").textContent = (isReaper || loggedMortal) ? "SAVE CHANGES" : (authMode === "signup" ? "SIGN UP & ENTER" : "SIGN IN");
      document.getElementById("logout-btn").style.display = loggedMortal ? "block" : "none";
      document.getElementById("close-modal-btn").style.display = (isReaper || loggedMortal) ? "block" : "none";
      document.getElementById("name-input").value = myName;
      document.getElementById("profile-modal").style.display = "flex";
    }

    function closeModal() { document.getElementById("profile-modal").style.display = "none"; }
    function mortalLogout() { localStorage.removeItem("mortal_room"); localStorage.removeItem("m_name"); localStorage.removeItem("m_av"); location.reload(); }
    if (!isReaper && (!room || !myName)) openModal();
    if (isReaper) { document.getElementById("auth-btn").textContent = "Exit Reaper"; document.getElementById("rooms-panel").style.display = "block"; }

    if ("Notification" in window && Notification.permission === "default") Notification.requestPermission();
    window.addEventListener("focus", () => { document.title = "TextYou // Messenger"; });

    function notifyNewMsg(sender, text) {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator(); const gain = ctx.createGain();
        osc.type = "sine"; osc.frequency.setValueAtTime(620, ctx.currentTime);
        gain.gain.setValueAtTime(0.06, ctx.currentTime);
        osc.connect(gain); gain.connect(ctx.destination); osc.start(); osc.stop(ctx.currentTime + 0.14);
      } catch (e) {}
      if (document.hidden) {
        document.title = "💬 New message! - TextYou";
        if ("Notification" in window && Notification.permission === "granted") new Notification("💀 TextYou - " + sender, { body: text });
      }
    }

    function compressImg(file, maxSize) {
      return new Promise(resolve => {
        const timer = setTimeout(() => resolve(""), 3000);
        const reader = new FileReader();
        reader.onload = e => {
          const img = new Image();
          img.onload = () => {
            clearTimeout(timer);
            const scale = Math.min(1, maxSize / Math.max(img.width, img.height));
            const c = document.createElement("canvas");
            c.width = img.width * scale; c.height = img.height * scale;
            c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
            resolve(c.toDataURL("image/jpeg", 0.72));
          };
          img.onerror = () => { clearTimeout(timer); resolve(""); };
          img.src = e.target.result;
        };
        reader.onerror = () => { clearTimeout(timer); resolve(""); };
        reader.readAsDataURL(file);
      });
    }

    async function handleAuthSubmit() {
      const rawName = document.getElementById("name-input").value.trim();
      const passVal = document.getElementById("pass-input").value.trim();
      if (!rawName) { alert("Please enter a username."); return; }
      const files = document.getElementById("file-input").files;
      const loggedMortal = !isReaper && room && myName;

      if (isReaper || loggedMortal) {
        myName = rawName; closeModal();
        if (files && files.length > 0) myAvatar = await compressImg(files.item(0), 110);
        localStorage.setItem(isReaper ? "r_name" : "m_name", myName);
        localStorage.setItem(isReaper ? "r_av" : "m_av", myAvatar);
        const url = isReaper ? DB + "/reaperProfile.json" : DB + "/rooms/" + room + "/profile.json";
        await fetch(url, { method: "PUT", body: JSON.stringify({ name: myName, avatar: myAvatar }) });
        lastCount = 0; sync(); return;
      }

      if (!passVal) { alert("Please enter a password."); return; }
      const userKey = rawName.toLowerCase().replace(/[^a-z0-9_]/g, "");
      if (!userKey) { alert("Use letters or numbers."); return; }

      const accRes = await fetch(DB + "/accounts/" + userKey + ".json");
      const accData = await accRes.json();

      if (authMode === "signup") {
        if (accData) { alert("Username already taken. Use Sign In."); return; }
        myName = rawName; room = "soul_" + userKey;
        if (files && files.length > 0) myAvatar = await compressImg(files.item(0), 110);
        await fetch(DB + "/accounts/" + userKey + ".json", { method: "PUT", body: JSON.stringify({ name: myName, pass: passVal, room: room, avatar: myAvatar }) });
        await fetch(DB + "/rooms/" + room + "/profile.json", { method: "PUT", body: JSON.stringify({ name: myName, avatar: myAvatar }) });
      } else {
        if (!accData || accData.pass !== passVal) { alert("Wrong username or password."); return; }
        myName = accData.name; room = accData.room; myAvatar = accData.avatar || "";
      }

      localStorage.setItem("mortal_room", room); localStorage.setItem("m_name", myName); localStorage.setItem("m_av", myAvatar);
      closeModal(); lastCount = 0; document.getElementById("messages").innerHTML = ""; sync();
    }
    function toggleReaper() {
      if (isReaper) { localStorage.removeItem("is_reaper"); location.reload(); return; }
      const p = prompt("Enter Reaper password:");
      if (p === PASS) { localStorage.setItem("is_reaper", "true"); location.reload(); }
      else if (p !== null) alert("Wrong password.");
    }

    function notifyTyping() {
      if (!room) return;
      const role = isReaper ? "reaper" : "mortal";
      fetch(DB + "/rooms/" + room + "/typing/" + role + ".json", { method: "PUT", body: JSON.stringify(Date.now()) });
    }

    async function sendChatImage(e) {
      const file = e.target.files && e.target.files.item(0); e.target.value = "";
      if (!file || !room) return;
      const imgData = await compressImg(file, 480);
      if (!imgData) return;
      const d = new Date(); const time = String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0");
      await fetch(DB + "/rooms/" + room + "/messages.json", { method: "POST", body: JSON.stringify({ sender: isReaper ? "reaper" : "mortal", senderName: myName, senderAvatar: myAvatar, text: "", image: imgData, time: time }) });
      sync();
    }

    async function sendMessage(e) {
      e.preventDefault();
      const input = document.getElementById("msg-input"); const text = input.value.trim();
      if (!text || !room) return;
      input.value = "";
      const d = new Date(); const time = String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0");
      if (!isReaper) await fetch(DB + "/rooms/" + room + "/profile.json", { method: "PUT", body: JSON.stringify({ name: myName || "Mortal", avatar: myAvatar }) });
      await fetch(DB + "/rooms/" + room + "/messages.json", { method: "POST", body: JSON.stringify({ sender: isReaper ? "reaper" : "mortal", senderName: myName, senderAvatar: myAvatar, text: text, time: time }) });
      sync();
    }

    function selectRoom(id) { room = id; lastCount = 0; document.getElementById("messages").innerHTML = ""; sync(); }
    async function deleteCurrentRoom() {
      if (!isReaper || !room) return;
      if (!confirm("Delete this soul's chat permanently?")) return;
      await fetch(DB + "/rooms/" + room + ".json", { method: "DELETE" });
      room = ""; lastCount = 0; document.getElementById("messages").innerHTML = ""; sync();
    }

    async function sync() {
      try {
        const rRes = await fetch(DB + "/reaperProfile.json"); const rData = await rRes.json();
        if (rData) {
          document.getElementById("reaper-name").textContent = rData.name || "THE REAPER";
          document.getElementById("reaper-av").innerHTML = (rData.avatar ? '<img src="' + rData.avatar + '" />' : "💀") + '<div class="status-dot"></div>';
        }
                if (isReaper) {
          const allRes = await fetch(DB + "/rooms.json");
          const all = await allRes.json();
          const box = document.getElementById("rooms-container");
          if (all) {
            const ids = Object.keys(all);
            if (ids.length > 0 && !ids.includes(room)) room = ids.at(0);
            box.innerHTML = "";
            ids.forEach(id => {
              const rData = all[id] || {};
              const prof = rData.profile || { name: id, avatar: "" };
              const msgs = rData.messages ? Object.values(rData.messages) : [];
              const count = msgs.length;
              const prev = roomCounts[id];

              if (prev !== undefined && count > prev && id !== room) {
                const newest = msgs.at(-1);
                if (newest && newest.sender === "mortal") {
                  notifyNewMsg(prof.name || "Soul", newest.text || "📷 Photo");
                }
              }
              if (id === room || prev === undefined) {
                roomCounts[id] = count;
              }

              const hasUnread = count > (roomCounts[id] || 0);
              const badge = hasUnread ? ' <span style="color:var(--pink);font-weight:bold;">●</span>' : '';
              const div = document.createElement("div");
              div.className = "room-item" + (id === room ? " active" : "");
              div.innerHTML = (prof.avatar ? '<img class="mini-av" src="' + prof.avatar + '" />' : '<span>👤</span>') + '<span>' + esc(prof.name) + badge + '</span>';
              div.onclick = () => { roomCounts[id] = count; selectRoom(id); };
              box.appendChild(div);
            });
          } else {
            box.innerHTML = "<div style='font-size:0.75rem;color:#a699c2;'>No souls yet...</div>";
          }
        }
          } else { box.innerHTML = "<div style='font-size:0.75rem;color:#a699c2;'>No souls yet...</div>"; }
        }
        if (!room) return;
        const res = await fetch(DB + "/rooms/" + room + ".json"); const data = await res.json();
        if (!data) return;
        const other = isReaper ? "mortal" : "reaper";
        const typed = (data.typing && data.typing[other]) ? data.typing[other] : 0;
        document.getElementById("typing").textContent = (Date.now() - typed < 3000) ? "Typing..." : "";
        if (data.messages) {
          const list = Object.values(data.messages);
          if (list.length !== lastCount) {
            const lastMsg = list.at(-1);
            if (lastCount > 0 && lastMsg && lastMsg.sender === other) notifyNewMsg(lastMsg.senderName || "New message", lastMsg.text || "📷 Photo");
            lastCount = list.length;
            const area = document.getElementById("messages"); area.innerHTML = "";
            list.forEach(m => {
              const row = document.createElement("div"); row.className = "msg-row " + m.sender;
              const icon = m.sender === "reaper" ? "💀" : "👤";
              const av = m.senderAvatar ? '<img class="msg-av" src="' + m.senderAvatar + '" />' : '<div class="msg-av">' + icon + '</div>';
              const bodyHtml = m.image ? '<img src="' + m.image + '" style="max-width:220px;max-height:240px;border-radius:6px;display:block;margin-top:4px;" />' : esc(m.text);
              row.innerHTML = av + '<div class="msg ' + m.sender + '"><div class="msg-meta"><span>' + esc(m.senderName || icon) + '</span><span>' + (m.time || "") + '</span></div><div>' + bodyHtml + '</div></div>';
              area.appendChild(row);
            });
            area.scrollTop = area.scrollHeight;
          }
        }
      } catch (e) {}
    }

    function esc(t) { const d = document.createElement("div"); d.textContent = t; return d.innerHTML; }
    setInterval(sync, 1200);
    sync();
  </script>
</body>
</html>
