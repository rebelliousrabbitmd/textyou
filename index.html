<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SOUL_LINK // Messenger</title>
  <style>
    :root { --bg:#1a1525; --win:#231d33; --border:#8e6cef; --pink:#ff6b9d; --cyan:#5ce1e6; --text:#f3effa; --muted:#a699c2; }
    * { box-sizing:border-box; margin:0; padding:0; font-family:'Courier New',monospace; }
    body { background:var(--bg); color:var(--text); height:100vh; display:flex; justify-content:center; align-items:center; overflow:hidden; }
    .os-window { width:95%; max-width:900px; height:92vh; background:var(--win); border:2px solid var(--border); border-radius:10px; display:flex; flex-direction:column; overflow:hidden; position:relative; }
    .title-bar { background:linear-gradient(90deg,#4b2c7a,#8e44ad); padding:10px 16px; display:flex; justify-content:space-between; align-items:center; border-bottom:2px solid var(--border); }
    .btn-top { background:rgba(0,0,0,0.4); border:1px solid var(--cyan); color:var(--cyan); padding:4px 10px; border-radius:4px; font-size:0.78rem; cursor:pointer; }
    .main-layout { display:flex; flex:1; overflow:hidden; }
    .sidebar { width:230px; background:#1c1729; border-right:2px solid #3c2e5c; padding:16px; display:flex; flex-direction:column; align-items:center; text-align:center; }
    .avatar-box { width:110px; height:110px; border:2px solid var(--pink); border-radius:10px; background:#2b2140; display:flex; justify-content:center; align-items:center; font-size:3.2rem; margin-bottom:10px; position:relative; overflow:hidden; }
    .avatar-box img { width:100%; height:100%; object-fit:cover; }
    .status-dot { width:12px; height:12px; background:#4ade80; border-radius:50%; position:absolute; bottom:6px; right:6px; border:2px solid #1c1729; }
    .char-name { font-weight:bold; font-size:1.05rem; color:var(--pink); }
    .char-bio { font-size:0.75rem; color:var(--muted); margin:6px 0 14px; }
    .rooms-list { width:100%; flex:1; overflow-y:auto; border-top:1px solid #3c2e5c; padding-top:10px; text-align:left; }
    .room-item { background:#261f38; border:1px solid #48386e; padding:8px; border-radius:6px; margin-bottom:6px; font-size:0.8rem; cursor:pointer; display:flex; align-items:center; gap:8px; }
    .room-item.active { border-color:var(--pink); background:#352952; }
    .mini-av { width:24px; height:24px; border-radius:50%; object-fit:cover; }
    .chat-section { flex:1; display:flex; flex-direction:column; }
    .messages-area { flex:1; padding:18px; overflow-y:auto; display:flex; flex-direction:column; gap:10px; }
    .msg-row { display:flex; align-items:flex-end; gap:8px; max-width:80%; }
    .msg-row.reaper { align-self:flex-start; }
    .msg-row.mortal { align-self:flex-end; flex-direction:row-reverse; }
    .msg-av { width:34px; height:34px; border-radius:8px; object-fit:cover; border:1px solid var(--border); background:#2b2140; flex-shrink:0; display:flex; align-items:center; justify-content:center; }
    .msg { padding:10px 14px; border-radius:8px; font-size:0.9rem; line-height:1.4; word-wrap:break-word; }
    .msg.reaper { background:#322947; border-left:3px solid var(--pink); }
    .msg.mortal { background:#6c3ce9; border-right:3px solid var(--cyan); }
    .msg-meta { font-size:0.68rem; opacity:0.75; margin-bottom:4px; display:flex; justify-content:space-between; gap:10px; }
    .typing-bar { height:20px; padding:0 18px; font-size:0.75rem; color:var(--cyan); font-style:italic; }
    .input-area { border-top:2px solid #3c2e5c; background:#1c1729; padding:12px; display:flex; gap:8px; }
    .input-area input { flex:1; background:#2b2242; border:1px solid var(--border); color:var(--text); padding:10px 12px; border-radius:6px; outline:none; }
    .input-area button { background:var(--pink); color:#1a1525; border:none; padding:0 20px; border-radius:6px; font-weight:bold; cursor:pointer; }
    .modal-overlay { position:absolute; inset:0; background:rgba(15,11,24,0.92); display:none; justify-content:center; align-items:center; z-index:20; padding:16px; }
    .modal-box { background:var(--win); border:2px solid var(--pink); border-radius:10px; padding:20px; width:100%; max-width:360px; display:flex; flex-direction:column; gap:12px; }
    .modal-box input { background:#1c1729; border:1px solid var(--border); color:var(--text); padding:8px; border-radius:6px; width:100%; }
    .save-btn { background:var(--pink); color:#1a1525; border:none; padding:10px; border-radius:6px; font-weight:bold; cursor:pointer; }
    @media (max-width:640px) { .sidebar { width:115px; padding:8px; } .avatar-box { width:65px; height:65px; font-size:2rem; } }
  </style>
</head>
<body>
  <div class="os-window">
    <div class="modal-overlay" id="profile-modal">
      <div class="modal-box">
        <div style="display:flex;justify-content:space-between;align-items:center;">
          <h3 id="modal-title" style="color:var(--pink);font-size:1rem;">TU PERFIL</h3>
          <button type="button" onclick="closeModal()" style="background:none;border:1px solid var(--muted);color:var(--muted);padding:2px 8px;cursor:pointer;">X</button>
        </div>
        <input type="text" id="name-input" maxlength="20" placeholder="Tu nombre o apodo..." />
        <input type="file" id="file-input" accept="image/*" />
        <button type="button" class="save-btn" onclick="saveProfile()">GUARDAR Y ENTRAR</button>
      </div>
    </div>
    <div class="title-bar">
      <div style="font-weight:bold;font-size:0.9rem;">💀 SOUL_LINK // Chat</div>
      <div style="display:flex;gap:8px;">
        <button type="button" class="btn-top" onclick="openModal()">Mi Perfil</button>
        <button type="button" class="btn-top" id="auth-btn" onclick="toggleReaper()">Soy el Reaper</button>
      </div>
    </div>
    <div class="main-layout">
      <aside class="sidebar">
        <div class="avatar-box" id="reaper-av">💀<div class="status-dot"></div></div>
        <div class="char-name" id="reaper-name">EL REAPER</div>
        <div class="char-bio">"En línea • Esperando almas"</div>
        <div class="rooms-list" id="rooms-panel" style="display:none;">
          <div style="font-size:0.75rem;color:var(--cyan);margin-bottom:8px;">ALMAS:</div>
          <div id="rooms-container"></div>
        </div>
      </aside>
      <section class="chat-section">
        <div class="messages-area" id="messages"></div>
        <div class="typing-bar" id="typing"></div>
        <form class="input-area" onsubmit="sendMessage(event)">
          <input type="text" id="msg-input" placeholder="Escribe un mensaje..." autocomplete="off" oninput="notifyTyping()" required />
          <button type="submit">ENVIAR</button>
        </form>
      </section>
    </div>
  </div>
  <script>
    const DB = "https://firebasedatabase.app";
    const PASS = "parca123";
    let isReaper = localStorage.getItem("is_reaper") === "true";
    let room = localStorage.getItem("mortal_room");
    if (!room) { room = "alma_" + Math.random().toString(36).substring(2, 8); localStorage.setItem("mortal_room", room); }
    let myName = localStorage.getItem(isReaper ? "r_name" : "m_name") || (isReaper ? "EL REAPER" : "");
    let myAvatar = localStorage.getItem(isReaper ? "r_av" : "m_av") || "";
    let lastCount = 0;

    function openModal() {
      document.getElementById("modal-title").textContent = isReaper ? "PERFIL DEL REAPER" : "PERFIL DE MORTAL";
      document.getElementById("name-input").value = myName;
      document.getElementById("profile-modal").style.display = "flex";
    }
    function closeModal() { document.getElementById("profile-modal").style.display = "none"; }
    if (!isReaper && !myName) openModal();
    if (isReaper) { document.getElementById("auth-btn").textContent = "Salir Reaper"; document.getElementById("rooms-panel").style.display = "block"; }
    function compressImg(file) {
      return new Promise(resolve => {
        const timer = setTimeout(() => resolve(""), 2000);
        const reader = new FileReader();
        reader.onload = e => {
          const img = new Image();
          img.onload = () => {
            clearTimeout(timer);
            const c = document.createElement("canvas");
            c.width = 100; c.height = 100;
            c.getContext("2d").drawImage(img, 0, 0, 100, 100);
            resolve(c.toDataURL("image/jpeg", 0.7));
          };
          img.onerror = () => { clearTimeout(timer); resolve(""); };
          img.src = e.target.result;
        };
        reader.onerror = () => { clearTimeout(timer); resolve(""); };
        reader.readAsDataURL(file);
      });
    }

    async function saveProfile() {
      const val = document.getElementById("name-input").value.trim();
      if (!val) { alert("Escribe un nombre."); return; }
      myName = val;
      closeModal();
      const files = document.getElementById("file-input").files;
      if (files && files.length > 0) myAvatar = await compressImg(files.item(0));
      localStorage.setItem(isReaper ? "r_name" : "m_name", myName);
      localStorage.setItem(isReaper ? "r_av" : "m_av", myAvatar);
      const url = isReaper ? DB + "/reaperProfile.json" : DB + "/rooms/" + room + "/profile.json";
      await fetch(url, { method: "PUT", body: JSON.stringify({ name: myName, avatar: myAvatar }) });
      lastCount = 0; sync();
    }

    function toggleReaper() {
      if (isReaper) { localStorage.removeItem("is_reaper"); location.reload(); return; }
      const p = prompt("Clave de Reaper:");
      if (p === PASS) { localStorage.setItem("is_reaper", "true"); location.reload(); }
      else if (p !== null) alert("Clave incorrecta.");
    }

    function notifyTyping() {
      if (!room) return;
      const role = isReaper ? "reaper" : "mortal";
      fetch(DB + "/rooms/" + room + "/typing/" + role + ".json", { method: "PUT", body: JSON.stringify(Date.now()) });
    }

    async function sendMessage(e) {
      e.preventDefault();
      const input = document.getElementById("msg-input");
      const text = input.value.trim();
      if (!text || !room) return;
      input.value = "";
      const d = new Date();
      const time = String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0");
      if (!isReaper) {
        await fetch(DB + "/rooms/" + room + "/profile.json", { method: "PUT", body: JSON.stringify({ name: myName || "Mortal", avatar: myAvatar }) });
      }
      await fetch(DB + "/rooms/" + room + "/messages.json", {
        method: "POST",
        body: JSON.stringify({ sender: isReaper ? "reaper" : "mortal", senderName: myName || (isReaper ? "EL REAPER" : "Mortal"), senderAvatar: myAvatar, text: text, time: time })
      });
      sync();
    }

    function selectRoom(id) { room = id; lastCount = 0; document.getElementById("messages").innerHTML = ""; sync(); }

    async function sync() {
      try {
        const rRes = await fetch(DB + "/reaperProfile.json");
        const rData = await rRes.json();
        if (rData) {
          document.getElementById("reaper-name").textContent = rData.name || "EL REAPER";
          document.getElementById("reaper-av").innerHTML = (rData.avatar ? '<img src="' + rData.avatar + '" />' : "💀") + '<div class="status-dot"></div>';
        }
        if (isReaper) {
          const allRes = await fetch(DB + "/rooms.json");
          const all = await allRes.json();
          const box = document.getElementById("rooms-container");
          if (all) {
            const ids = Object.keys(all);
            if (ids.length > 0 && !ids.includes(room)) room = ids.at(0);
            box.innerHTML = "";
            ids.forEach(id => {
              const prof = (all[id] && all[id].profile) ? all[id].profile : { name: id, avatar: "" };
              const div = document.createElement("div");
              div.className = "room-item" + (id === room ? " active" : "");
              div.innerHTML = (prof.avatar ? '<img class="mini-av" src="' + prof.avatar + '" />' : '<span>👤</span>') + '<span>' + esc(prof.name) + '</span>';
              div.onclick = () => selectRoom(id);
              box.appendChild(div);
            });
          } else { box.innerHTML = "<div style='font-size:0.75rem;color:#a699c2;'>Sin almas...</div>"; }
        }
        if (!room) return;
        const res = await fetch(DB + "/rooms/" + room + ".json");
        const data = await res.json();
        if (!data) return;
        const other = isReaper ? "mortal" : "reaper";
        const typed = (data.typing && data.typing[other]) ? data.typing[other] : 0;
        document.getElementById("typing").textContent = (Date.now() - typed < 3000) ? "Escribiendo..." : "";
        if (data.messages) {
          const list = Object.values(data.messages);
          if (list.length !== lastCount) {
            lastCount = list.length;
            const area = document.getElementById("messages");
            area.innerHTML = "";
            list.forEach(m => {
              const row = document.createElement("div");
              row.className = "msg-row " + m.sender;
              const icon = m.sender === "reaper" ? "💀" : "👤";
              const av = m.senderAvatar ? '<img class="msg-av" src="' + m.senderAvatar + '" />' : '<div class="msg-av">' + icon + '</div>';
              row.innerHTML = av + '<div class="msg ' + m.sender + '"><div class="msg-meta"><span>' + esc(m.senderName || icon) + '</span><span>' + (m.time || "") + '</span></div><div>' + esc(m.text) + '</div></div>';
              area.appendChild(row);
            });
            area.scrollTop = area.scrollHeight;
          }
        }
      } catch (e) {}
    }

    function esc(t) { const d = document.createElement("div"); d.textContent = t; return d.innerHTML; }
    setInterval(sync, 1200);
    sync();
  </script>
</body>
</html>
