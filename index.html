<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SOUL_LINK // Messenger</title>
  <style>
    :root {
      --bg-desktop: #1a1525;
      --window-bg: #231d33;
      --window-border: #8e6cef;
      --header-bg: linear-gradient(90deg, #4b2c7a, #8e44ad);
      --msg-reaper: #322947;
      --msg-mortal: #6c3ce9;
      --accent-pink: #ff6b9d;
      --accent-cyan: #5ce1e6;
      --text-main: #f3effa;
      --text-muted: #a699c2;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Courier New', Courier, monospace; }
    body {
      background-color: var(--bg-desktop);
      background-image: radial-gradient(#34294f 1px, transparent 1px);
      background-size: 20px 20px;
      color: var(--text-main);
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }
    .os-window {
      width: 95%; max-width: 920px; height: 92vh;
      background: var(--window-bg);
      border: 2px solid var(--window-border);
      border-radius: 10px;
      box-shadow: 0 0 25px rgba(142, 108, 239, 0.35);
      display: flex; flex-direction: column; overflow: hidden;
      position: relative;
    }
    .title-bar {
      background: var(--header-bg); padding: 10px 16px;
      display: flex; justify-content: space-between; align-items: center;
      border-bottom: 2px solid var(--window-border);
    }
    .title { font-weight: bold; font-size: 0.95rem; display: flex; align-items: center; gap: 8px; }
    .header-actions { display: flex; gap: 8px; }
    .reaper-login-btn {
      background: rgba(0, 0, 0, 0.35); border: 1px solid var(--accent-cyan);
      color: var(--accent-cyan); padding: 4px 10px; border-radius: 4px;
      font-size: 0.78rem; cursor: pointer;
    }
    .main-layout { display: flex; flex: 1; overflow: hidden; }
    .sidebar {
      width: 245px; background: #1c1729; border-right: 2px solid #3c2e5c;
      padding: 16px; display: flex; flex-direction: column; align-items: center; text-align: center;
    }
    .avatar-box {
      width: 115px; height: 115px; border: 2px solid var(--accent-pink);
      border-radius: 10px; background: #2b2140;
      display: flex; justify-content: center; align-items: center;
      font-size: 3.5rem; margin-bottom: 10px; position: relative; overflow: hidden;
    }
    .avatar-box img { width: 100%; height: 100%; object-fit: cover; }
    .status-dot {
      width: 13px; height: 13px; background: #4ade80; border-radius: 50%;
      position: absolute; bottom: 6px; right: 6px; border: 2px solid #1c1729; z-index: 2;
    }
    .char-name { font-weight: bold; font-size: 1.1rem; color: var(--accent-pink); }
    .char-bio { font-size: 0.78rem; color: var(--text-muted); margin: 6px 0 14px; }
    .rooms-list {
      width: 100%; flex: 1; overflow-y: auto;
      border-top: 1px solid #3c2e5c; padding-top: 10px; text-align: left;
    }
    .rooms-list h4 { font-size: 0.75rem; color: var(--accent-cyan); margin-bottom: 8px; }
    .room-item {
      background: #261f38; border: 1px solid #48386e;
      padding: 8px; border-radius: 6px; margin-bottom: 6px; font-size: 0.8rem; cursor: pointer;
      display: flex; align-items: center; gap: 8px;
    }
    .room-item.active { border-color: var(--accent-pink); background: #352952; }
    .mini-avatar { width: 24px; height: 24px; border-radius: 50%; object-fit: cover; background: #1a1525; }
    .chat-section { flex: 1; display: flex; flex-direction: column; }
    .messages-area {
      flex: 1; padding: 20px; overflow-y: auto;
      display: flex; flex-direction: column; gap: 12px;
    }
    .msg-row { display: flex; align-items: flex-end; gap: 8px; max-width: 80%; }
    .msg-row.reaper { align-self: flex-start; }
    .msg-row.mortal { align-self: flex-end; flex-direction: row-reverse; }
    .msg-avatar {
      width: 34px; height: 34px; border-radius: 8px; object-fit: cover;
      border: 1px solid var(--window-border); background: #2b2140; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center; font-size: 1.1rem;
    }
    .msg { padding: 10px 14px; border-radius: 8px; font-size: 0.92rem; line-height: 1.4; word-wrap: break-word; }
    .msg.reaper { background: var(--msg-reaper); border-left: 3px solid var(--accent-pink); }
    .msg.mortal { background: var(--msg-mortal); border-right: 3px solid var(--accent-cyan); }
    .msg-meta { font-size: 0.68rem; opacity: 0.75; margin-bottom: 4px; display: flex; justify-content: space-between; gap: 12px; }
    .typing-bar { height: 22px; padding: 0 20px; font-size: 0.78rem; color: var(--accent-cyan); font-style: italic; }
    .input-area { border-top: 2px solid #3c2e5c; background: #1c1729; padding: 12px; display: flex; gap: 10px; }
    .input-area input {
      flex: 1; background: #2b2242; border: 1px solid var(--window-border);
      color: var(--text-main); padding: 12px 14px; border-radius: 6px; outline: none; font-size: 0.95rem;
    }
    .input-area button {
      background: var(--accent-pink); color: #1a1525; border: none;
      padding: 0 22px; border-radius: 6px; font-weight: bold; cursor: pointer;
    }
    .input-area button:hover { background: var(--accent-cyan); }
    /* Modal de Perfil */
    .modal-overlay {
      position: absolute; inset: 0; background: rgba(15, 11, 24, 0.9);
      display: none; justify-content: center; align-items: center; z-index: 20; padding: 16px;
    }
    .modal-box {
      background: #231d33; border: 2px solid var(--accent-pink); border-radius: 10px;
      padding: 20px; width: 100%; max-width: 380px; display: flex; flex-direction: column; gap: 12px;
    }
    .modal-box h3 { color: var(--accent-pink); font-size: 1rem; }
    .modal-box label { font-size: 0.8rem; color: var(--accent-cyan); }
    .modal-box input[type="text"], .modal-box input[type="file"] {
      background: #1c1729; border: 1px solid var(--window-border); color: var(--text-main);
      padding: 8px; border-radius: 6px; width: 100%;
    }
    .modal-box button {
      background: var(--accent-pink); color: #1a1525; border: none; padding: 10px;
      border-radius: 6px; font-weight: bold; cursor: pointer; margin-top: 4px;
    }
    @media (max-width: 640px) {
      .sidebar { width: 120px; padding: 10px; }
      .avatar-box { width: 68px; height: 68px; font-size: 2rem; }
    }
  </style>
</head>
<body>
  <div class="os-window">
    <!-- Ventana emergente para configurar perfil (Nombre + Foto) -->
    <div class="modal-overlay" id="profile-modal">
      <div class="modal-box">
        <h3 id="modal-title">CONFIGURAR TU PERFIL</h3>
        <div>
          <label>Tu Nombre / Apodo:</label>
          <input type="text" id="profile-name-input" maxlength="20" placeholder="Ej. Alex..." />
        </div>
        <div>
          <label>Tu Imagen de Perfil (desde tu galería/PC):</label>
          <input type="file" id="profile-file-input" accept="image/*" />
        </div>
        <button onclick="saveProfile()">GUARDAR Y ENTRAR</button>
      </div>
    </div>

    <div class="title-bar">
      <div class="title">💀 SOUL_LINK // Chat Directo</div>
      <div class="header-actions">
        <button class="reaper-login-btn" onclick="openProfileModal()">Mi Perfil</button>
        <button class="reaper-login-btn" id="auth-btn" onclick="toggleReaperMode()">Soy el Reaper</button>
      </div>
    </div>

    <div class="main-layout">
      <aside class="sidebar">
        <div class="avatar-box" id="reaper-sidebar-avatar">
          💀
          <div class="status-dot"></div>
        </div>
        <div class="char-name" id="reaper-sidebar-name">EL REAPER</div>
        <div class="char-bio">"En línea • Esperando almas"</div>
        <div class="rooms-list" id="rooms-panel" style="display: none;">
          <h4>ALMAS CONECTADAS:</h4>
          <div id="rooms-container"></div>
        </div>
      </aside>

      <section class="chat-section">
        <div class="messages-area" id="messages"></div>
        <div class="typing-bar" id="typing-indicator"></div>
        <form class="input-area" onsubmit="sendMessage(event)">
          <input type="text" id="msg-input" placeholder="Escribe un mensaje..." autocomplete="off" oninput="notifyTyping()" required />
          <button type="submit">ENVIAR</button>
        </form>
      </section>
    </div>
  </div>

  <script>
    const FIREBASE_URL = "https://firebasedatabase.app";
    const REAPER_PASSWORD = "parca123";

    let isReaper = localStorage.getItem("is_reaper") === "true";
    let currentRoom = localStorage.getItem("mortal_room");
    if (!currentRoom) {
      currentRoom = "alma_" + Math.random().toString(36).substring(2, 8);
      localStorage.setItem("mortal_room", currentRoom);
    }

    let myName = localStorage.getItem(isReaper ? "reaper_name" : "mortal_name") || (isReaper ? "EL REAPER" : "");
    let myAvatar = localStorage.getItem(isReaper ? "reaper_avatar" : "mortal_avatar") || "";
    let reaperGlobal = { name: "EL REAPER", avatar: "" };
    let lastMsgCount = 0;

    // Mostrar ventana de perfil si el visitante aún no puso su nombre
    if (!isReaper && !myName) {
      openProfileModal();
    }

    if (isReaper) {
      document.getElementById("auth-btn").textContent = "Salir Reaper";
      document.getElementById("auth-btn").style.borderColor = "#ff6b9d";
      document.getElementById("auth-btn").style.color = "#ff6b9d";
      document.getElementById("rooms-panel").style.display = "block";
    }

    function openProfileModal() {
      document.getElementById("modal-title").textContent = isReaper ? "PERFIL DEL REAPER (TÚ)" : "CREA TU PERFIL DE MORTAL";
      document.getElementById("profile-name-input").value = myName;
      document.getElementById("profile-modal").style.display = "flex";
    }

    // Comprimir foto subida para guardarla ligera en Firebase
    function compressImage(file) {
      return new Promise(resolve => {
        const reader = new FileReader();
        reader.onload = e => {
          const img = new Image();
          img.onload = () => {
            const canvas = document.createElement("canvas");
            canvas.width = 120; canvas.height = 120;
            const ctx = canvas.getContext("2d");
            ctx.drawImage(img, 0, 0, 120, 120);
            resolve(canvas.toDataURL("image/jpeg", 0.75));
          };
          img.src = e.target.result;
        };
        reader.readAsDataURL(file);
      });
    }

        async function saveProfile() {
      const nameVal = document.getElementById("profile-name-input").value.trim();
      const fileInput = document.getElementById("profile-file-input");
      if (!nameVal) { alert("Por favor, escribe un nombre."); return; }

      myName = nameVal;
      document.getElementById("profile-modal").style.display = "none";

      try {
        if (fileInput.files && fileInput.files.at(0)) {
          myAvatar = await compressImage(fileInput.files.at(0));
        }

        localStorage.setItem(isReaper ? "reaper_name" : "mortal_name", myName);
        localStorage.setItem(isReaper ? "reaper_avatar" : "mortal_avatar", myAvatar);

        const endpoint = isReaper ? `${FIREBASE_URL}/reaperProfile.json` : `${FIREBASE_URL}/rooms/${currentRoom}/profile.json`;
        await fetch(endpoint, {
          method: "PUT",
          body: JSON.stringify({ name: myName, avatar: myAvatar })
        });
      } catch (err) {
        console.error("Error guardando perfil:", err);
      }

      lastMsgCount = 0;
      syncChat();
    }
    function toggleReaperMode() {
      if (isReaper) {
        localStorage.removeItem("is_reaper");
        location.reload();
        return;
      }
      const pass = prompt("Introduce tu clave de Reaper:");
      if (pass === REAPER_PASSWORD) {
        localStorage.setItem("is_reaper", "true");
        location.reload();
      } else if (pass !== null) {
        alert("Clave incorrecta, mortal.");
      }
    }

    function playBeep() {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = "sine";
        osc.frequency.setValueAtTime(580, ctx.currentTime);
        gain.gain.setValueAtTime(0.05, ctx.currentTime);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.12);
      } catch (e) {}
    }

    async function notifyTyping() {
      if (!currentRoom) return;
      const role = isReaper ? "reaper" : "mortal";
      await fetch(`${FIREBASE_URL}/rooms/${currentRoom}/typing/${role}.json`, {
        method: "PUT",
        body: JSON.stringify(Date.now())
      });
    }

    async function sendMessage(e) {
      e.preventDefault();
      const input = document.getElementById("msg-input");
      const text = input.value.trim();
      if (!text || !currentRoom) return;

      input.value = "";
      const now = new Date();
      const timeStr = now.getHours().toString().padStart(2, "0") + ":" + now.getMinutes().toString().padStart(2, "0");

      if (!isReaper) {
        await fetch(`${FIREBASE_URL}/rooms/${currentRoom}/profile.json`, {
          method: "PUT",
          body: JSON.stringify({ name: myName || "Mortal", avatar: myAvatar })
        });
      }

      await fetch(`${FIREBASE_URL}/rooms/${currentRoom}/messages.json`, {
        method: "POST",
        body: JSON.stringify({
          sender: isReaper ? "reaper" : "mortal",
          senderName: myName || (isReaper ? "EL REAPER" : "Mortal"),
          senderAvatar: myAvatar,
          text: text,
          time: timeStr
        })
      });
      syncChat();
    }

    function selectRoom(roomId) {
      currentRoom = roomId;
      lastMsgCount = 0;
      document.getElementById("messages").innerHTML = "";
      syncChat();
    }

    async function syncChat() {
      try {
        // 1. Actualizar perfil público del Reaper en la barra lateral
        const rRes = await fetch(`${FIREBASE_URL}/reaperProfile.json`);
        const rData = await rRes.json();
        if (rData) {
          reaperGlobal = rData;
          document.getElementById("reaper-sidebar-name").textContent = rData.name || "EL REAPER";
          const box = document.getElementById("reaper-sidebar-avatar");
          box.innerHTML = (rData.avatar ? `<img src="${rData.avatar}" />` : "💀") + `<div class="status-dot"></div>`;
        }

        // 2. Si eres Reaper, listar todas las almas con su nombre y foto
        if (isReaper) {
          const allRes = await fetch(`${FIREBASE_URL}/rooms.json`);
          const allRooms = await allRes.json();
          const container = document.getElementById("rooms-container");
          if (allRooms) {
            const roomIds = Object.keys(allRooms);
            if (roomIds.length > 0 && !roomIds.includes(currentRoom)) {
              currentRoom = roomIds.at(0);
            }
            container.innerHTML = "";
            roomIds.forEach(id => {
              const prof = allRooms[id].profile || { name: id, avatar: "" };
              const div = document.createElement("div");
              div.className = `room-item ${id === currentRoom ? "active" : ""}`;
              const imgHtml = prof.avatar ? `<img class="mini-avatar" src="${prof.avatar}" />` : `<span>👤</span>`;
              div.innerHTML = `${imgHtml} <span>${escapeHtml(prof.name)}</span>`;
              div.onclick = () => selectRoom(id);
              container.appendChild(div);
            });
          } else {
            container.innerHTML = "<div style='font-size:0.75rem;color:#a699c2;'>Sin almas conectadas...</div>";
          }
        }

        if (!currentRoom) return;

        // 3. Cargar mensajes de la sala activa
        const res = await fetch(`${FIREBASE_URL}/rooms/${currentRoom}.json`);
        const roomData = await res.json();
        const messagesEl = document.getElementById("messages");
        if (!roomData) return;

        const otherRole = isReaper ? "mortal" : "reaper";
        const lastTyped = roomData.typing && roomData.typing[otherRole] ? roomData.typing[otherRole] : 0;
        const typingEl = document.getElementById("typing-indicator");
        typingEl.textContent = (Date.now() - lastTyped < 3000) ? "Escribiendo..." : "";

        if (roomData.messages) {
          const msgList = Object.values(roomData.messages);
          if (msgList.length !== lastMsgCount) {
            if (lastMsgCount > 0 && msgList.at(-1).sender === otherRole) playBeep();
            lastMsgCount = msgList.length;
            messagesEl.innerHTML = "";
            msgList.forEach(m => {
              const row = document.createElement("div");
              row.className = `msg-row ${m.sender}`;
              const fallbackIcon = m.sender === "reaper" ? "💀" : "👤";
              const avatarHtml = m.senderAvatar
                ? `<img class="msg-avatar" src="${m.senderAvatar}" />`
                : `<div class="msg-avatar">${fallbackIcon}</div>`;
              row.innerHTML = `
                ${avatarHtml}
                <div class="msg ${m.sender}">
                  <div class="msg-meta"><span>${escapeHtml(m.senderName || fallbackIcon)}</span><span>${m.time || ""}</span></div>
                  <div>${escapeHtml(m.text)}</div>
                </div>
              `;
              messagesEl.appendChild(row);
            });
            messagesEl.scrollTop = messagesEl.scrollHeight;
          }
        }
      } catch (err) {
        console.error("Error de red:", err);
      }
    }

    function escapeHtml(text) {
      const div = document.createElement("div");
      div.textContent = text;
      return div.innerHTML;
    }

    setInterval(syncChat, 1200);
    syncChat();
  </script>
</body>
</html>
